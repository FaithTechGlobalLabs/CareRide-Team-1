# On a fork, keep main aligned with FaithTechGlobalLabs/CareRide-Team-1#main
# so Cloudflare Pages can auto-deploy without org admin. Does nothing on the
# upstream repo. Enable Actions on the fork after forking.
# GitHub cron's shortest interval is once per minute.
name: Sync upstream main

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/FaithTechGlobalLabs/CareRide-Team-1.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main
