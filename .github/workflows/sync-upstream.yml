# On a fork, keep main aligned with FaithTechGlobalLabs/CareRide-Team-1#main
# so Cloudflare can auto-deploy without org admin. Does nothing on the
# upstream repo. Enable Actions on the fork after forking.
#
# Immediate sync is handled by sync-deploy-fork.yml on the upstream repo.
# This schedule is the fallback (GitHub will not run cron more often than
# about every five minutes).
name: Sync upstream main

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main from parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync "${{ github.repository }}" --branch main
